schema_version: 1
name: v0.4.0-nav2-acceptance
baseline_params: src/robot_bringup/config/nav2_params_robot.yaml
dataset: bag_07_navigation
repetitions_per_target: 5

vehicle_characterization:
  status: measurement_required
  report: verification/reports/calibration/v0.4.0-vehicle-dynamics.yaml
  required_measurements:
    minimum_stable_linear_mps: null
    minimum_stable_angular_radps: null
    startup_deadband_mps: null
    braking_distance_m: null
    maximum_stable_linear_accel_mps2: null
    maximum_stable_angular_accel_radps2: null

# 每个轴首项对应当前保守基线；实测底盘动态后才能生成正式候选。
parameter_axes:
  min_speed_xy: [0.08, 0.05, 0.10]
  min_speed_theta: [0.40, 0.25, 0.55]
  acc_lim_x: [0.65, 0.40, 0.80]
  acc_lim_theta: [1.00, 0.70, 1.30]
  decel_lim_x: [-0.75, -0.50, -0.90]
  decel_lim_theta: [-1.00, -0.70, -1.30]
  xy_goal_tolerance: [0.18, 0.12, 0.25]
  yaw_goal_tolerance: [0.35, 0.25, 0.45]
  trans_stopped_velocity: [0.08, 0.05, 0.10]

parameter_paths:
  min_speed_xy:
    - [controller_server, ros__parameters, FollowPath, min_speed_xy]
  min_speed_theta:
    - [controller_server, ros__parameters, FollowPath, min_speed_theta]
  acc_lim_x:
    - [controller_server, ros__parameters, FollowPath, acc_lim_x]
  acc_lim_theta:
    - [controller_server, ros__parameters, FollowPath, acc_lim_theta]
  decel_lim_x:
    - [controller_server, ros__parameters, FollowPath, decel_lim_x]
  decel_lim_theta:
    - [controller_server, ros__parameters, FollowPath, decel_lim_theta]
  xy_goal_tolerance:
    - [controller_server, ros__parameters, goal_checker, xy_goal_tolerance]
    - [controller_server, ros__parameters, FollowPath, xy_goal_tolerance]
  yaw_goal_tolerance:
    - [controller_server, ros__parameters, goal_checker, yaw_goal_tolerance]
  trans_stopped_velocity:
    - [controller_server, ros__parameters, FollowPath, trans_stopped_velocity]

targets:
  - {id: target_01, pose: null}
  - {id: target_02, pose: null}
  - {id: target_03, pose: null}
  - {id: target_04, pose: null}
  - {id: target_05, pose: null}
  - {id: target_06, pose: null}
  - {id: target_07, pose: null}
  - {id: target_08, pose: null}
  - {id: target_09, pose: null}
  - {id: target_10, pose: null}

acceptance:
  total_trials: {operator: ">=", limit: 50}
  successful_trials: {operator: ">=", limit: 45}
  success_rate_percent: {operator: ">=", limit: 90.0}
  position_error_p95_m: {operator: "<=", limit: 0.20}
  yaw_error_p95_rad: {operator: "<=", limit: 0.35}
  recovery_count: {operator: "<=", limit: 10}
  collision_count: {operator: "<=", limit: 0}
  manual_intervention_count: {operator: "<=", limit: 0}
  unexpected_motion_count: {operator: "<=", limit: 0}
