$schema: https://json-schema.org/draft/2020-12/schema
title: Robot verification result v1
type: object
required: [schema_version, release, result, upper_commit, firmware_commit, hardware_revision, config_sha256, metrics]
properties:
  schema_version: {const: 1}
  release: {type: string}
  result: {enum: [PASS, FAIL, NOT_RUN]}
  upper_commit: {type: [string, 'null']}
  firmware_commit: {type: [string, 'null']}
  hardware_revision: {type: [string, integer, 'null']}
  config_sha256: {type: [string, 'null']}
  started_at: {type: [string, 'null']}
  metrics: {type: object}
