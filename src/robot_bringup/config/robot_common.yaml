robot:
  ros__parameters:
    platform: raspberry_pi_4b
    os: ubuntu_22_04_64bit
    ros_distro: humble

    # TF frame names
    base_frame: base_link
    base_footprint_frame: base_footprint
    odom_frame: odom
    map_frame: map
    laser_frame: laser_frame
    imu_frame: imu_link

    # Fusion
    odom_source: bridge
    ekf_enabled_by_default: false

    # Serial
    baudrate: 115200
    cmd_timeout_sec: 0.25
    drive_keepalive_sec: 0.10

    # =========================================================================
    # 运动学参数（上位机实际使用的仅 wheel_track_width 和 wheel_radius）
    #
    # MCU 通过串口协议上报 m/s 轮速，已内置 encoder_dir / motor_dir 修正。
    # 编码器 CPR、方向、电机方向、PID、电流限速等全部在 STM32 固件闭环，
    # 上位机无需关心。wheel_track_width 用于 protocol_v2.py 计算 wz：
    #   wz = (right_speed - left_speed) / wheel_track_width
    # wheel_radius 不参与任何计算，仅日志输出。
    # =========================================================================

    wheel_radius_m: 0.0350          # [已实测] 轮径 70mm
    wheel_track_width_m: 0.176      # [已实测] 有效轮距 176mm（机械 181.5mm）

    # =========================================================================
    # 机械尺寸 & TF — 以下参数待实测后填入
    # =========================================================================
    chassis_length_m: 0.0           # [待实测] 底盘总长 (m)
    chassis_width_m: 0.0            # [待实测] 底盘总宽 (m)
    chassis_height_m: 0.0           # [待实测] 底盘高度 (m)
    lidar_mount_x: 0.07             # [待实测] 雷达 X 偏移，当前为临时值
    lidar_mount_y: 0.0              # [待实测] 雷达 Y 偏移
    lidar_mount_z: 0.13             # [待实测] 雷达 Z 偏移，当前为临时值
    lidar_mount_yaw: 1.571          # [待实测] 雷达 yaw (rad)，π/2 为临时值
    footprint: ""                   # [待实测] 格式 "[[x1,y1],[x2,y2],...]"，当前 nav2 临时值 [[±0.11,±0.075]]
