[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(build|install|log|vendor|src/vendor|docs/archive)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "build",
    "install",
    "log",
    "vendor",
    "src/vendor",
    "docs/archive",
    "firmware-contract",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
check_untyped_defs = true
no_implicit_optional = false
exclude = "(build|install|log|vendor|src/vendor|docs/archive)/"
